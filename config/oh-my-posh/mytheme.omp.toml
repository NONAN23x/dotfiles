console_title_template = '{{ .Folder }}'
version = 3

[palette]
  base = '#191724'
  surface = '#1f1d2e'
  overlay = '#26233a'
  muted = '#6e6a86'
  subtle = '#908caa'
  text = '#e0def4'
  love = '#eb6f92'
  gold = '#f6c177'
  rose = '#ebbcba'
  pine = '#31748f'
  foam = '#9ccfd8'
  iris = '#c4a7e7'
  highlight_low = '#21202e'
  highlight_med = '#403d52'
  highlight_high = '#524f67'

[transient_prompt]
  foreground_templates = [
    "{{ if gt .Code 0 }}#eb6f92{{ end }}",
    "{{ if eq .Code 0 }}#c4a7e7{{ end }}",
  ]
  background = 'transparent'
  template = '{{ .UserName }}@{{ .HostName }} ❯ '

[upgrade]
  source = 'cdn'
  interval = '168h'
  auto = false
  notice = false

[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  [[blocks.segments]]
    template = '{{ if .SSHSession }}󰣀 <p:foam>{{ .UserName }}</><p:muted>@</><p:pine>{{ .HostName }}</> {{ else }}<p:iris>{{ .UserName }}</> {{ end }}'
    foreground = 'p:text'
    background = 'transparent'
    type = 'session'
    style = 'plain'

[[blocks]]
  type = 'prompt'
  alignment = 'right'

  [[blocks.segments]]
    leading_diamond = ''
    trailing_diamond = ''
    template = '󰘚 <p:rose>{{ printf "%.2f" .Load1 }}</> <p:muted>·</> 󰍛 <p:foam>{{ round .PhysicalPercentUsed .Precision }}%</>'
    foreground = 'p:text'
    background = 'p:surface'
    type = 'sysinfo'
    style = 'diamond'
    timeout = 100

    [blocks.segments.cache]
      duration = '10s'
      strategy = 'device'

    [blocks.segments.properties]
      precision = 0

  [[blocks.segments]]
    leading_diamond = ''
    trailing_diamond = ''
    template = '󰔛 <p:rose>{{ .FormattedMs }}s</>'
    foreground = 'p:text'
    background = 'p:overlay'
    type = 'executiontime'
    style = 'diamond'

    [blocks.segments.properties]
      style = 'dallas'
      threshold = 1000

  [[blocks.segments]]
    leading_diamond = ''
    trailing_diamond = ''
    template = '󰞀'
    foreground = 'p:base'
    background = 'p:love'
    type = 'root'
    style = 'diamond'

  [[blocks.segments]]
    leading_diamond = ''
    trailing_diamond = ''
    template = '󰎙 {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }}'
    foreground = 'p:base'
    background = 'p:pine'
    type = 'node'
    style = 'diamond'
    timeout = 100

    [blocks.segments.properties]
      cache_duration = '5m'

  [[blocks.segments]]
    leading_diamond = ''
    trailing_diamond = ''
    template = '󰌠 {{ .Full }}'
    foreground = 'p:base'
    background = 'p:iris'
    type = 'python'
    style = 'diamond'
    timeout = 100

    [blocks.segments.properties]
      cache_duration = '5m'

  [[blocks.segments]]
    leading_diamond = ''
    trailing_diamond = ''
    template = '󰟓 {{ .Full }}'
    foreground = 'p:base'
    background = 'p:foam'
    type = 'go'
    style = 'diamond'
    timeout = 100

    [blocks.segments.properties]
      cache_duration = '5m'

  [[blocks.segments]]
    template = ' 󰃭 <p:subtle>{{ .CurrentDate | date .Format }}</> '
    foreground = 'p:text'
    background = 'transparent'
    type = 'time'
    style = 'plain'

    [blocks.segments.properties]
      time_format = 'Mon 15:04'

[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  [[blocks.segments]]
    template = '󰉋 {{ .Path }} '
    foreground = 'p:foam'
    background = 'transparent'
    type = 'path'
    style = 'plain'

    [blocks.segments.properties]
      folder_icon = '/'
      folder_separator_icon = ' / '
      home_icon = 'home'
      style = 'agnoster_full'

  [[blocks.segments]]
    leading_diamond = ''
    trailing_diamond = ''
    template = '<p:rose>{{ .UpstreamIcon }}</>{{ .HEAD }}{{ if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }} <p:gold> {{ .Working.String }}</>{{ end }}{{ if .Staging.Changed }} <p:foam> {{ .Staging.String }}</>{{ end }}'
    foreground = 'p:text'
    background = 'p:surface'
    background_templates = [
      '{{ if or .Working.Changed .Staging.Changed }}p:highlight_med{{ end }}',
      '{{ if and (gt .Ahead 0) (gt .Behind 0) }}p:love{{ end }}',
      '{{ if gt .Ahead 0 }}p:pine{{ end }}',
      '{{ if gt .Behind 0 }}p:gold{{ end }}'
    ]
    type = 'git'
    style = 'diamond'
    timeout = 200

    [blocks.segments.cache]
      duration = '2s'
      strategy = 'folder'

    [blocks.segments.properties]
      branch_icon = ' '
      fetch_status = true
      fetch_upstream_icon = true

  [[blocks.segments]]
    template = ' ❯ '
    foreground = 'p:iris'
    type = 'status'
    style = 'plain'
    foreground_templates = [
      '{{ if gt .Code 0 }}p:love{{ end }}',
      '{{ if and (eq .Code 0) .Root }}p:gold{{ end }}'
    ]

    [blocks.segments.properties]
      always_enabled = true
